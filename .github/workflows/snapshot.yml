name: Daily snapshot

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/snapshot.py, .github/workflows/snapshot.yml]

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python scripts/snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update market snapshot"
          git pull --rebase --quiet
          git push
